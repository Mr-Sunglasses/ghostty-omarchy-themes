# Rose Pine Dawn for tmux, generated from the Omarchy theme's colors.
set -g status-style "bg=#faf4ed,fg=#575279"
set -g status-left-style "fg=#56949f,bold"
set -g status-right-style "fg=#cecacd"
set -g window-status-style "fg=#cecacd"
set -g window-status-current-style "fg=#56949f,bold"
set -g pane-border-style "fg=#cecacd"
set -g pane-active-border-style "fg=#56949f"
set -g message-style "bg=#dfdad9,fg=#575279"
set -g message-command-style "bg=#dfdad9,fg=#575279"
set -g mode-style "bg=#dfdad9,fg=#575279"
set -g display-panes-active-colour "#56949f"
set -g display-panes-colour "#cecacd"
set -g clock-mode-colour "#56949f"
