# Starship for tmux, generated from the Omarchy theme's colors.
set -g status-style "bg=#1c1c1e,fg=#f5f5f7"
set -g status-left-style "fg=#ff9f0a,bold"
set -g status-right-style "fg=#8e8e93"
set -g window-status-style "fg=#8e8e93"
set -g window-status-current-style "fg=#ff9f0a,bold"
set -g pane-border-style "fg=#8e8e93"
set -g pane-active-border-style "fg=#ff9f0a"
set -g message-style "bg=#3a3a3c,fg=#ffffff"
set -g message-command-style "bg=#3a3a3c,fg=#ffffff"
set -g mode-style "bg=#3a3a3c,fg=#ffffff"
set -g display-panes-active-colour "#ff9f0a"
set -g display-panes-colour "#8e8e93"
set -g clock-mode-colour "#ff9f0a"
