# Ethereal for tmux, generated from the Omarchy theme's colors.
set -g status-style "bg=#060B1E,fg=#ffcead"
set -g status-left-style "fg=#7d82d9,bold"
set -g status-right-style "fg=#6d7db6"
set -g window-status-style "fg=#6d7db6"
set -g window-status-current-style "fg=#7d82d9,bold"
set -g pane-border-style "fg=#6d7db6"
set -g pane-active-border-style "fg=#7d82d9"
set -g message-style "bg=#252e56,fg=#ffcead"
set -g message-command-style "bg=#252e56,fg=#ffcead"
set -g mode-style "bg=#252e56,fg=#ffcead"
set -g display-panes-active-colour "#7d82d9"
set -g display-panes-colour "#6d7db6"
set -g clock-mode-colour "#7d82d9"
