# Everforest for tmux, generated from the Omarchy theme's colors.
set -g status-style "bg=#2d353b,fg=#d3c6aa"
set -g status-left-style "fg=#7fbbb3,bold"
set -g status-right-style "fg=#475258"
set -g window-status-style "fg=#475258"
set -g window-status-current-style "fg=#7fbbb3,bold"
set -g pane-border-style "fg=#475258"
set -g pane-active-border-style "fg=#7fbbb3"
set -g message-style "bg=#3d484d,fg=#d3c6aa"
set -g message-command-style "bg=#3d484d,fg=#d3c6aa"
set -g mode-style "bg=#3d484d,fg=#d3c6aa"
set -g display-panes-active-colour "#7fbbb3"
set -g display-panes-colour "#475258"
set -g clock-mode-colour "#7fbbb3"
