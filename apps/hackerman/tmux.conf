# Hackerman for tmux, generated from the Omarchy theme's colors.
set -g status-style "bg=#0B0C16,fg=#ddf7ff"
set -g status-left-style "fg=#82FB9C,bold"
set -g status-right-style "fg=#2d3450"
set -g window-status-style "fg=#2d3450"
set -g window-status-current-style "fg=#82FB9C,bold"
set -g pane-border-style "fg=#2d3450"
set -g pane-active-border-style "fg=#82FB9C"
set -g message-style "bg=#1f253a,fg=#ddf7ff"
set -g message-command-style "bg=#1f253a,fg=#ddf7ff"
set -g mode-style "bg=#1f253a,fg=#ddf7ff"
set -g display-panes-active-colour "#82FB9C"
set -g display-panes-colour "#2d3450"
set -g clock-mode-colour "#82FB9C"
