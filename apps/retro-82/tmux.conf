# Retro 82 for tmux, generated from the Omarchy theme's colors.
set -g status-style "bg=#05182e,fg=#f6dcac"
set -g status-left-style "fg=#faa968,bold"
set -g status-right-style "fg=#2a6b78"
set -g window-status-style "fg=#2a6b78"
set -g window-status-current-style "fg=#faa968,bold"
set -g pane-border-style "fg=#2a6b78"
set -g pane-active-border-style "fg=#faa968"
set -g message-style "bg=#134e5a,fg=#f6dcac"
set -g message-command-style "bg=#134e5a,fg=#f6dcac"
set -g mode-style "bg=#134e5a,fg=#f6dcac"
set -g display-panes-active-colour "#faa968"
set -g display-panes-colour "#2a6b78"
set -g clock-mode-colour "#faa968"
