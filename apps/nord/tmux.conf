# Nord for tmux, generated from the Omarchy theme's colors.
set -g status-style "bg=#2e3440,fg=#d8dee9"
set -g status-left-style "fg=#81a1c1,bold"
set -g status-right-style "fg=#4c566a"
set -g window-status-style "fg=#4c566a"
set -g window-status-current-style "fg=#81a1c1,bold"
set -g pane-border-style "fg=#4c566a"
set -g pane-active-border-style "fg=#81a1c1"
set -g message-style "bg=#434c5e,fg=#d8dee9"
set -g message-command-style "bg=#434c5e,fg=#d8dee9"
set -g mode-style "bg=#434c5e,fg=#d8dee9"
set -g display-panes-active-colour "#81a1c1"
set -g display-panes-colour "#4c566a"
set -g clock-mode-colour "#81a1c1"
