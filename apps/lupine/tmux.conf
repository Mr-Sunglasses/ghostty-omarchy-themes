# Lupine for tmux, generated from the Omarchy theme's colors.
set -g status-style "bg=#fafafa,fg=#212121"
set -g status-left-style "fg=#3264eb,bold"
set -g status-right-style "fg=#9e9e9e"
set -g window-status-style "fg=#9e9e9e"
set -g window-status-current-style "fg=#3264eb,bold"
set -g pane-border-style "fg=#9e9e9e"
set -g pane-active-border-style "fg=#3264eb"
set -g message-style "bg=#d0d0d0,fg=#000000"
set -g message-command-style "bg=#d0d0d0,fg=#000000"
set -g mode-style "bg=#d0d0d0,fg=#000000"
set -g display-panes-active-colour "#3264eb"
set -g display-panes-colour "#9e9e9e"
set -g clock-mode-colour "#3264eb"
