# Osaka Jade for tmux, generated from the Omarchy theme's colors.
set -g status-style "bg=#111c18,fg=#C1C497"
set -g status-left-style "fg=#509475,bold"
set -g status-right-style "fg=#53685B"
set -g window-status-style "fg=#53685B"
set -g window-status-current-style "fg=#509475,bold"
set -g pane-border-style "fg=#53685B"
set -g pane-active-border-style "fg=#509475"
set -g message-style "bg=#32473B,fg=#F7E8B2"
set -g message-command-style "bg=#32473B,fg=#F7E8B2"
set -g mode-style "bg=#32473B,fg=#F7E8B2"
set -g display-panes-active-colour "#509475"
set -g display-panes-colour "#53685B"
set -g clock-mode-colour "#509475"
