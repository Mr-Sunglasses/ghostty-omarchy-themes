# Flexoki Light for tmux, generated from the Omarchy theme's colors.
set -g status-style "bg=#FFFCF0,fg=#100F0F"
set -g status-left-style "fg=#205EA6,bold"
set -g status-right-style "fg=#B7B5AC"
set -g window-status-style "fg=#B7B5AC"
set -g window-status-current-style "fg=#205EA6,bold"
set -g pane-border-style "fg=#B7B5AC"
set -g pane-active-border-style "fg=#205EA6"
set -g message-style "bg=#CECDC3,fg=#100F0F"
set -g message-command-style "bg=#CECDC3,fg=#100F0F"
set -g mode-style "bg=#CECDC3,fg=#100F0F"
set -g display-panes-active-colour "#205EA6"
set -g display-panes-colour "#B7B5AC"
set -g clock-mode-colour "#205EA6"
