# Lumon for tmux, generated from the Omarchy theme's colors.
set -g status-style "bg=#16242d,fg=#d6e2ee"
set -g status-left-style "fg=#8bc9eb,bold"
set -g status-right-style "fg=#304860"
set -g window-status-style "fg=#304860"
set -g window-status-current-style "fg=#8bc9eb,bold"
set -g pane-border-style "fg=#304860"
set -g pane-active-border-style "fg=#8bc9eb"
set -g message-style "bg=#243d56,fg=#f2fcff"
set -g message-command-style "bg=#243d56,fg=#f2fcff"
set -g mode-style "bg=#243d56,fg=#f2fcff"
set -g display-panes-active-colour "#8bc9eb"
set -g display-panes-colour "#304860"
set -g clock-mode-colour "#8bc9eb"
