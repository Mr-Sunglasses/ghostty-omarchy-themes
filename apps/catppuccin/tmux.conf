# Catppuccin Mocha for tmux, generated from the Omarchy theme's colors.
set -g status-style "bg=#1e1e2e,fg=#cdd6f4"
set -g status-left-style "fg=#89b4fa,bold"
set -g status-right-style "fg=#585b70"
set -g window-status-style "fg=#585b70"
set -g window-status-current-style "fg=#89b4fa,bold"
set -g pane-border-style "fg=#585b70"
set -g pane-active-border-style "fg=#89b4fa"
set -g message-style "bg=#45475a,fg=#cdd6f4"
set -g message-command-style "bg=#45475a,fg=#cdd6f4"
set -g mode-style "bg=#45475a,fg=#cdd6f4"
set -g display-panes-active-colour "#89b4fa"
set -g display-panes-colour "#585b70"
set -g clock-mode-colour "#89b4fa"
