# White for tmux, generated from the Omarchy theme's colors.
set -g status-style "bg=#ffffff,fg=#000000"
set -g status-left-style "fg=#6e6e6e,bold"
set -g status-right-style "fg=#808080"
set -g window-status-style "fg=#808080"
set -g window-status-current-style "fg=#6e6e6e,bold"
set -g pane-border-style "fg=#808080"
set -g pane-active-border-style "fg=#6e6e6e"
set -g message-style "bg=#c0c0c0,fg=#000000"
set -g message-command-style "bg=#c0c0c0,fg=#000000"
set -g mode-style "bg=#c0c0c0,fg=#000000"
set -g display-panes-active-colour "#6e6e6e"
set -g display-panes-colour "#808080"
set -g clock-mode-colour "#6e6e6e"
