# Gruvbox for tmux, generated from the Omarchy theme's colors.
set -g status-style "bg=#282828,fg=#d4be98"
set -g status-left-style "fg=#7daea3,bold"
set -g status-right-style "fg=#665c54"
set -g window-status-style "fg=#665c54"
set -g window-status-current-style "fg=#7daea3,bold"
set -g pane-border-style "fg=#665c54"
set -g pane-active-border-style "fg=#7daea3"
set -g message-style "bg=#504945,fg=#d4be98"
set -g message-command-style "bg=#504945,fg=#d4be98"
set -g mode-style "bg=#504945,fg=#d4be98"
set -g display-panes-active-colour "#7daea3"
set -g display-panes-colour "#665c54"
set -g clock-mode-colour "#7daea3"
