# Last Horizon for tmux, generated from the Omarchy theme's colors.
set -g status-style "bg=#0c0b0c,fg=#FAFCFB"
set -g status-left-style "fg=#b59790,bold"
set -g status-right-style "fg=#584e51"
set -g window-status-style "fg=#584e51"
set -g window-status-current-style "fg=#b59790,bold"
set -g pane-border-style "fg=#584e51"
set -g pane-active-border-style "fg=#b59790"
set -g message-style "bg=#584e51,fg=#e2dddc"
set -g message-command-style "bg=#584e51,fg=#e2dddc"
set -g mode-style "bg=#584e51,fg=#e2dddc"
set -g display-panes-active-colour "#b59790"
set -g display-panes-colour "#584e51"
set -g clock-mode-colour "#b59790"
