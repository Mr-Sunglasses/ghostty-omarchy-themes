# Solitude for tmux, generated from the Omarchy theme's colors.
set -g status-style "bg=#101315,fg=#cacccc"
set -g status-left-style "fg=#798186,bold"
set -g status-right-style "fg=#4b4e55"
set -g window-status-style "fg=#4b4e55"
set -g window-status-current-style "fg=#798186,bold"
set -g pane-border-style "fg=#4b4e55"
set -g pane-active-border-style "fg=#798186"
set -g message-style "bg=#343d41,fg=#a5aeb4"
set -g message-command-style "bg=#343d41,fg=#a5aeb4"
set -g mode-style "bg=#343d41,fg=#a5aeb4"
set -g display-panes-active-colour "#798186"
set -g display-panes-colour "#4b4e55"
set -g clock-mode-colour "#798186"
