# Catppuccin Latte for tmux, generated from the Omarchy theme's colors.
set -g status-style "bg=#eff1f5,fg=#4c4f69"
set -g status-left-style "fg=#1e66f5,bold"
set -g status-right-style "fg=#acb0be"
set -g window-status-style "fg=#acb0be"
set -g window-status-current-style "fg=#1e66f5,bold"
set -g pane-border-style "fg=#acb0be"
set -g pane-active-border-style "fg=#1e66f5"
set -g message-style "bg=#ccd0da,fg=#4c4f69"
set -g message-command-style "bg=#ccd0da,fg=#4c4f69"
set -g mode-style "bg=#ccd0da,fg=#4c4f69"
set -g display-panes-active-colour "#1e66f5"
set -g display-panes-colour "#acb0be"
set -g clock-mode-colour "#1e66f5"
