# Vantablack for tmux, generated from the Omarchy theme's colors.
set -g status-style "bg=#000000,fg=#ffffff"
set -g status-left-style "fg=#8d8d8d,bold"
set -g status-right-style "fg=#7a7a7a"
set -g window-status-style "fg=#7a7a7a"
set -g window-status-current-style "fg=#8d8d8d,bold"
set -g pane-border-style "fg=#7a7a7a"
set -g pane-active-border-style "fg=#8d8d8d"
set -g message-style "bg=#1a1a1a,fg=#ffffff"
set -g message-command-style "bg=#1a1a1a,fg=#ffffff"
set -g mode-style "bg=#1a1a1a,fg=#ffffff"
set -g display-panes-active-colour "#8d8d8d"
set -g display-panes-colour "#7a7a7a"
set -g clock-mode-colour "#8d8d8d"
