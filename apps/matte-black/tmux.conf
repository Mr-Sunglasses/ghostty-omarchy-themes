# Matte Black for tmux, generated from the Omarchy theme's colors.
set -g status-style "bg=#121212,fg=#bebebe"
set -g status-left-style "fg=#e68e0d,bold"
set -g status-right-style "fg=#333333"
set -g window-status-style "fg=#333333"
set -g window-status-current-style "fg=#e68e0d,bold"
set -g pane-border-style "fg=#333333"
set -g pane-active-border-style "fg=#e68e0d"
set -g message-style "bg=#2a2a2a,fg=#bebebe"
set -g message-command-style "bg=#2a2a2a,fg=#bebebe"
set -g mode-style "bg=#2a2a2a,fg=#bebebe"
set -g display-panes-active-colour "#e68e0d"
set -g display-panes-colour "#333333"
set -g clock-mode-colour "#e68e0d"
