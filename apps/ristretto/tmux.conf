# Ristretto for tmux, generated from the Omarchy theme's colors.
set -g status-style "bg=#2c2525,fg=#e6d9db"
set -g status-left-style "fg=#f38d70,bold"
set -g status-right-style "fg=#72696a"
set -g window-status-style "fg=#72696a"
set -g window-status-current-style "fg=#f38d70,bold"
set -g pane-border-style "fg=#72696a"
set -g pane-active-border-style "fg=#f38d70"
set -g message-style "bg=#403e41,fg=#e6d9db"
set -g message-command-style "bg=#403e41,fg=#e6d9db"
set -g mode-style "bg=#403e41,fg=#e6d9db"
set -g display-panes-active-colour "#f38d70"
set -g display-panes-colour "#72696a"
set -g clock-mode-colour "#f38d70"
