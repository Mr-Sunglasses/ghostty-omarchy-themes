# Tokyo Night for tmux, generated from the Omarchy theme's colors.
set -g status-style "bg=#1a1b26,fg=#a9b1d6"
set -g status-left-style "fg=#7aa2f7,bold"
set -g status-right-style "fg=#414868"
set -g window-status-style "fg=#414868"
set -g window-status-current-style "fg=#7aa2f7,bold"
set -g pane-border-style "fg=#414868"
set -g pane-active-border-style "fg=#7aa2f7"
set -g message-style "bg=#292e42,fg=#c0caf5"
set -g message-command-style "bg=#292e42,fg=#c0caf5"
set -g mode-style "bg=#292e42,fg=#c0caf5"
set -g display-panes-active-colour "#7aa2f7"
set -g display-panes-colour "#414868"
set -g clock-mode-colour "#7aa2f7"
