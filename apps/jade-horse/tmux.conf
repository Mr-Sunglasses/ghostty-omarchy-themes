# Jade Horse for tmux, generated from the Omarchy theme's colors.
set -g status-style "bg=#142620,fg=#dfede5"
set -g status-left-style "fg=#8bcbb1,bold"
set -g status-right-style "fg=#64887b"
set -g window-status-style "fg=#64887b"
set -g window-status-current-style "fg=#8bcbb1,bold"
set -g pane-border-style "fg=#64887b"
set -g pane-active-border-style "fg=#8bcbb1"
set -g message-style "bg=#2b5147,fg=#f0faf4"
set -g message-command-style "bg=#2b5147,fg=#f0faf4"
set -g mode-style "bg=#2b5147,fg=#f0faf4"
set -g display-panes-active-colour "#8bcbb1"
set -g display-panes-colour "#64887b"
set -g clock-mode-colour "#8bcbb1"
