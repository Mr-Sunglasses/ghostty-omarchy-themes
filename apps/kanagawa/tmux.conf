# Kanagawa for tmux, generated from the Omarchy theme's colors.
set -g status-style "bg=#1f1f28,fg=#dcd7ba"
set -g status-left-style "fg=#dcd7ba,bold"
set -g status-right-style "fg=#54546D"
set -g window-status-style "fg=#54546D"
set -g window-status-current-style "fg=#dcd7ba,bold"
set -g pane-border-style "fg=#54546D"
set -g pane-active-border-style "fg=#dcd7ba"
set -g message-style "bg=#363646,fg=#dcd7ba"
set -g message-command-style "bg=#363646,fg=#dcd7ba"
set -g mode-style "bg=#363646,fg=#dcd7ba"
set -g display-panes-active-colour "#dcd7ba"
set -g display-panes-colour "#54546D"
set -g clock-mode-colour "#dcd7ba"
