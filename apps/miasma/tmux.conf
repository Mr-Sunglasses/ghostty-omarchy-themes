# Miasma for tmux, generated from the Omarchy theme's colors.
set -g status-style "bg=#222222,fg=#c2c2b0"
set -g status-left-style "fg=#78824b,bold"
set -g status-right-style "fg=#666666"
set -g window-status-style "fg=#666666"
set -g window-status-current-style "fg=#78824b,bold"
set -g pane-border-style "fg=#666666"
set -g pane-active-border-style "fg=#78824b"
set -g message-style "bg=#383838,fg=#c2c2b0"
set -g message-command-style "bg=#383838,fg=#c2c2b0"
set -g mode-style "bg=#383838,fg=#c2c2b0"
set -g display-panes-active-colour "#78824b"
set -g display-panes-colour "#666666"
set -g clock-mode-colour "#78824b"
